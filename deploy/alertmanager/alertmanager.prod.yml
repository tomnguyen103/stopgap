# Alertmanager — PRODUCTION routes (Phase 6.4 observability).
#
# The dev config next to this one ships a deliberately silent receiver so `docker compose up`
# needs no secrets. A deployment cannot inherit that: an alert nobody receives is worse than no
# alert, because the stack still looks like it has alerting. So this file routes every alert to a
# real Slack channel and reads the webhook from a file mounted by the compose stack —
# `docker-compose.prod.yml` interpolates ALERTMANAGER_SLACK_WEBHOOK_FILE with `:?`, so a deploy
# that never set it fails to start rather than coming up silently deaf.
#
# Alertmanager does not expand environment variables in this file, so the channel is written here
# (a channel name is not a secret) and only the webhook comes from the mounted file. Swapping
# Slack for PagerDuty/email is a receiver change; the fail-if-absent stance must survive the swap.
route:
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: oncall

receivers:
  - name: oncall
    slack_configs:
      # api_url_file, not api_url: the webhook is a deployment-managed secret, never a value
      # baked into a file that lives in git.
      - api_url_file: /run/secrets/alertmanager_slack_webhook
        channel: '#pharmacy-oncall'
        send_resolved: true
        title: '{{ .CommonLabels.alertname }} ({{ .Status }})'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'
