# Stopgap single-VPS deployment (PROJECT_PLAN §11).
#
#   cd deploy && cp .env.prod.example .env && $EDITOR .env
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Everything runs on one host: app, worker, Temporal + UI, one Postgres holding three
# databases (app / temporal / langfuse), Langfuse, a CPU Ollama, and Caddy for TLS.
#
# Ports are deliberately NOT published for anything except Caddy. There is no auth layer
# (PHASE5-TODO.md), so the console, Temporal UI and Langfuse are reachable only through
# Caddy, which is where the basic-auth gate lives.
name: stopgap-prod

x-app-env: &app-env
  DATABASE_URL: postgres://stopgap:${POSTGRES_PASSWORD}@postgres:5432/stopgap
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: default
  TEMPORAL_TASK_QUEUE: stopgap-cases
  LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
  OLLAMA_BASE_URL: http://ollama:11434
  OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral}
  OPENFDA_API_KEY: ${OPENFDA_API_KEY:-}
  ASHP_AUTH_KEY: ${ASHP_AUTH_KEY:-}
  LANGFUSE_BASE_URL: http://langfuse-web:3000
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  COMMS_FROM: ${COMMS_FROM:-stopgap@example.com}
  COMMS_PHARMACY_TO: ${COMMS_PHARMACY_TO:-}
  COMMS_DEMO_INBOX: ${COMMS_DEMO_INBOX:-}
  EHR_WEBHOOK_URL: ${EHR_WEBHOOK_URL:-http://localhost:4000/ehr/formulary-flag}
  STOPGAP_DEMO_MODE: ${STOPGAP_DEMO_MODE:-on}
  LLM_DAILY_USD_CAP: ${LLM_DAILY_USD_CAP:-}
  DEMO_MAX_RUNS_PER_HOUR: ${DEMO_MAX_RUNS_PER_HOUR:-6}
  # OIDC SSO / RBAC (PHASE6 §6.1). Honest non-configuration: with these unset (and demo mode on,
  # the default here), `authConfigured()` is false, so the console runs read-only as the
  # anonymous viewer — never a faked sign-in. Set AUTH_SECRET + KEYCLOAK_CLIENT_SECRET and turn
  # demo mode off to enforce the role matrix. The issuer is the PUBLIC Keycloak URL so the token
  # `iss` matches what the browser is redirected to.
  AUTH_SECRET: ${AUTH_SECRET:-}
  KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-https://${AUTH_DOMAIN}/realms/stopgap}
  KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-stopgap-console}
  KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stopgap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: stopgap
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stopgap"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.25.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: stopgap
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 30

  temporal-ui:
    image: temporalio/ui:2.34.0
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: https://${TEMPORAL_DOMAIN}

  # Local model, CPU-only. `ollama-pull` runs once at boot so the first case doesn't pay for
  # a multi-GB download while a visitor waits.
  ollama:
    image: ollama/ollama:0.5.7
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

  ollama-pull:
    image: ollama/ollama:0.5.7
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull ${OLLAMA_MODEL:-mistral}"]
    restart: "no"

  # Schema migration as a one-shot: the app and worker must not race each other applying it.
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: worker
    depends_on:
      postgres:
        condition: service_healthy
    environment: *app-env
    command: ["pnpm", "--filter", "@stopgap/db", "migrate"]
    restart: "no"

  console:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: console
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    environment: *app-env
    # Liveness via the always-200 health route (PHASE6 §6.4). `node -e` rather than curl/wget so it
    # works on the minimal Next runtime image regardless of what shell tools it ships.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: worker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      # Wait for the model download, not just the container: the worker's first case would
      # otherwise fail its assessment before `ollama pull` finishes (a multi-GB first boot).
      ollama-pull:
        condition: service_completed_successfully
    environment: *app-env
    # Liveness via the worker's HTTP sidecar (PHASE6 §6.4) — the same port Prometheus scrapes.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:9464/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  # Nightly demo re-seed (PROJECT_PLAN §11). A sleep loop rather than a cron image: one
  # dependency fewer, and the seeder is idempotent so a missed or doubled run is harmless.
  demo-seed:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: worker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: *app-env
    entrypoint:
      ["sh", "-c", "while true; do pnpm --filter @stopgap/demo seed || true; sleep 86400; done"]

  # ---- Keycloak (OIDC IdP, PHASE6 §6.1) ----------------------------------------------------
  # Production mode against a dedicated `keycloak` database in the shared Postgres, behind Caddy
  # (which terminates TLS — hence KC_PROXY_HEADERS + KC_HTTP_ENABLED). The Caddyfile routes
  # ${AUTH_DOMAIN} to this service on :8080.
  #
  # CWE-798: prod does NOT import the dev realm (deploy/keycloak/realm-stopgap.json) — it carries
  # a FIXED confidential client secret and known demo passwords (incl. an admin). The operator
  # provisions the prod realm, `stopgap-console` client, users, and a fresh client secret out of
  # band (Keycloak admin console at ${AUTH_DOMAIN}, bootstrap creds below), then sets
  # KEYCLOAK_CLIENT_SECRET in deploy/.env. Until then, auth is honestly unconfigured (blank
  # secret → console runs read-only), same stance as the rest of the blank prod .env. See
  # docs/auth.md "Provisioning the production realm".
  keycloak-db-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command: >-
      sh -c "psql -h postgres -U stopgap -d stopgap -tAc \"SELECT 1 FROM pg_database WHERE datname='keycloak'\" | grep -q 1 || psql -h postgres -U stopgap -d stopgap -c 'CREATE DATABASE keycloak'"
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-db-init:
        condition: service_completed_successfully
    # No `--import-realm`: the prod realm is provisioned out of band, never seeded from the dev
    # realm file (CWE-798). Nothing under deploy/keycloak is mounted here.
    command: ["start"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: stopgap
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: https://${AUTH_DOMAIN}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'UP'",
        ]
      interval: 10s
      timeout: 5s
      retries: 40

  # ---- Langfuse (self-hosted tracing) ------------------------------------------------------
  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24.3
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  langfuse-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  langfuse-minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server /data'
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse-db-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command: >-
      sh -c "psql -h postgres -U stopgap -d stopgap -tAc \"SELECT 1 FROM pg_database WHERE datname='langfuse'\" | grep -q 1 || psql -h postgres -U stopgap -d stopgap -c 'CREATE DATABASE langfuse'"
    restart: "no"

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    restart: unless-stopped
    depends_on:
      langfuse-db-init:
        condition: service_completed_successfully
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    environment: &langfuse-env
      DATABASE_URL: postgres://stopgap:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      NEXTAUTH_URL: https://${TRACES_DOMAIN}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_USER}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/

  langfuse-web:
    image: langfuse/langfuse:3
    restart: unless-stopped
    depends_on:
      langfuse-worker:
        condition: service_started
    environment:
      <<: *langfuse-env
      LANGFUSE_INIT_ORG_ID: stopgap
      LANGFUSE_INIT_ORG_NAME: Stopgap
      LANGFUSE_INIT_PROJECT_ID: stopgap-prod
      LANGFUSE_INIT_PROJECT_NAME: Stopgap
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_ADMIN_EMAIL}
      LANGFUSE_INIT_USER_NAME: Stopgap Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD}

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - console
      - temporal-ui
      - langfuse-web
      - keycloak
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      TEMPORAL_DOMAIN: ${TEMPORAL_DOMAIN}
      TRACES_DOMAIN: ${TRACES_DOMAIN}
      AUTH_DOMAIN: ${AUTH_DOMAIN}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # ---- Observability (PHASE6 §6.4) ---------------------------------------------------------
  # Prometheus scrapes the compose-internal console (:3000/api/metrics) and worker (:9464/metrics)
  # via prometheus.prod.yml; Grafana auto-provisions the datasource + Ops/Business dashboards;
  # Alertmanager holds the alert routes. No published ports — like the console/Temporal-UI/Langfuse
  # they sit on the internal network; a real deployment routes Grafana through Caddy behind
  # basic-auth (add an ${OPS_DOMAIN} block to the Caddyfile) rather than exposing it directly.
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  pgdata:
  clickhouse-data:
  minio-data:
  ollama:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
