# Local infra for Stopgap Phase 1: Postgres + Temporal + Temporal UI.
# Ollama runs on the host (not containerized locally). Langfuse added in Phase 2.
name: stopgap

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stopgap
      POSTGRES_PASSWORD: stopgap
      POSTGRES_DB: stopgap
    ports:
      # Host 5433 to avoid clashing with a host-installed Postgres on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stopgap"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The non-superuser application role (PHASE6 §6.5). One-shot, idempotent, runs on every `up` —
  # NOT an /docker-entrypoint-initdb.d script, which would only fire on a first boot with an empty
  # volume and so would skip every developer who already has data. See deploy/postgres/app-role.sql
  # for what it grants and why each grant is needed.
  #
  # WHAT THIS DOES AND DOES NOT DO FOR LOCAL DEV. It creates `stopgap_app` and makes it usable, so
  # `pnpm test:rls` (which REFUSES to run as a role the policies do not apply to) works with no
  # manual SQL. It does not repoint the app: in this stack the console and worker run on the HOST,
  # so their `DATABASE_URL` comes from `packages/core/src/env.ts`, whose zero-config default is
  # still the `stopgap` superuser — the single-role development configuration. That configuration
  # does not enforce isolation, and nothing here pretends otherwise: the pool logs a loud warning at
  # startup and `/api/readyz` reports `rlsEnforced: false`. To develop against the enforcing shape,
  # put this pair in your local .env (see docs/multi-tenancy.md):
  #   DATABASE_URL=postgres://stopgap_app:stopgap_app@localhost:5433/stopgap
  #   DATABASE_URL_MAINTENANCE=postgres://stopgap:stopgap@localhost:5433/stopgap
  # The password here is a DEV-ONLY throwaway, like every other credential in this file.
  app-role-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: stopgap
    volumes:
      - ./deploy/postgres/app-role.sql:/app-role.sql:ro
    command:
      [
        "psql",
        "-v",
        "ON_ERROR_STOP=1",
        "-h",
        "postgres",
        "-U",
        "stopgap",
        "-d",
        "stopgap",
        "-v",
        "app_pw=stopgap_app",
        "-v",
        "owner=stopgap",
        "-f",
        "/app-role.sql",
      ]
    restart: "no"

  temporal:
    image: temporalio/auto-setup:1.25.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: stopgap
      POSTGRES_PWD: stopgap
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 15

  temporal-ui:
    image: temporalio/ui:2.34.0
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8233:8080"

  # OIDC identity provider (PHASE6 §6.1). Always-on (no profile) so `docker compose up` alone
  # stands up a working IdP: `--import-realm` seeds the `stopgap` realm, the `stopgap-console`
  # client, and one demo user per role (see deploy/keycloak/realm-stopgap.json). The console
  # runs on the host in dev, so KEYCLOAK_ISSUER defaults to http://localhost:8080/realms/stopgap.
  # ALL passwords here are DEV-ONLY throwaways — never reuse them anywhere real.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image ships no curl; probe the management health port over bash's /dev/tcp.
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'UP'",
        ]
      interval: 10s
      timeout: 5s
      retries: 30

  # ---------------------------------------------------------------------------------------
  # Langfuse (self-hosted, PROJECT_PLAN §9) — everything below is behind the `langfuse`
  # profile, so plain `docker compose up -d` still starts only the Phase 1 spine:
  #   docker compose --profile langfuse up -d
  # Langfuse v3 needs ClickHouse (analytics store), Redis (queue) and S3-compatible blob
  # storage in addition to Postgres; that's why this is opt-in rather than always-on.
  # LANGFUSE_INIT_* seeds a deterministic local org/project/API-key pair so tracing works
  # headlessly — these are throwaway local-dev credentials, never production secrets.
  # ---------------------------------------------------------------------------------------
  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24.3
    profiles: ["langfuse"]
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse-redis:
    image: redis:7-alpine
    profiles: ["langfuse"]
    restart: unless-stopped
    command: --requirepass langfuse
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "langfuse", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse-minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    profiles: ["langfuse"]
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server /data --console-address ":9001"'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    volumes:
      - minio-data:/data
    healthcheck:
      # `|| exit 0` here would make the check unfailable, and dependents would start against
      # a dead MinIO. Hit MinIO's own liveness endpoint instead.
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Langfuse needs its own database in the shared Postgres. The image's own init scripts only
  # run on a first-boot empty volume, and the Phase 1 volume already exists — so create it
  # here. `|| true` would also swallow connection and auth failures and let langfuse-worker
  # start against a database that does not exist, so check for existence first and let any
  # real psql error fail the service.
  langfuse-db-init:
    image: postgres:16-alpine
    profiles: ["langfuse"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: stopgap
    command: >-
      sh -c "psql -h postgres -U stopgap -d stopgap -tAc \"SELECT 1 FROM pg_database WHERE datname='langfuse'\" | grep -q 1 || psql -h postgres -U stopgap -d stopgap -c 'CREATE DATABASE langfuse'"
    restart: "no"

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    profiles: ["langfuse"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      langfuse-db-init:
        condition: service_completed_successfully
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    environment: &langfuse-env
      DATABASE_URL: postgres://stopgap:stopgap@postgres:5432/langfuse
      SALT: local-dev-salt
      # Quoted: an unquoted all-digit value is parsed as a number and reaches Langfuse as
      # "0", failing its 64-hex-char validation. Local-dev throwaway key.
      ENCRYPTION_KEY: "1a2b3c4d5e6f70819a2b3c4d5e6f70819a2b3c4d5e6f70819a2b3c4d5e6f7081"
      NEXTAUTH_SECRET: local-dev-secret
      NEXTAUTH_URL: http://localhost:3001
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/

  langfuse-web:
    image: langfuse/langfuse:3
    profiles: ["langfuse"]
    restart: unless-stopped
    depends_on:
      langfuse-worker:
        condition: service_started
    environment:
      <<: *langfuse-env
      LANGFUSE_INIT_ORG_ID: stopgap
      LANGFUSE_INIT_ORG_NAME: Stopgap
      LANGFUSE_INIT_PROJECT_ID: stopgap-local
      LANGFUSE_INIT_PROJECT_NAME: Stopgap (local)
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-stopgap-local
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-stopgap-local
      LANGFUSE_INIT_USER_EMAIL: local@stopgap.test
      LANGFUSE_INIT_USER_NAME: Local Dev
      LANGFUSE_INIT_USER_PASSWORD: stopgaplocal
    ports:
      - "3001:3000"

  # ---------------------------------------------------------------------------------------
  # Observability (PHASE6 §6.4) — always-on so `docker compose up` shows populated dashboards
  # with no manual clicking. In dev the console (:3000) and worker (:9464) run on the HOST, so
  # Prometheus reaches them via host.docker.internal (see deploy/prometheus/prometheus.yml).
  # Grafana auto-provisions the Prometheus datasource + the Ops and Business KPI dashboards.
  # ---------------------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    # Lets the container resolve the host-run console/worker on Linux (Docker Desktop maps it
    # automatically, but this keeps `docker compose up` working on native Linux too).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      # Loopback only: the Alertmanager UI has no auth and can silence alerts, so publishing it on
      # every host interface would let anyone who can reach the machine suppress paging.
      - "127.0.0.1:9093:9093"

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Per-machine secret, not a shared literal: set GRAFANA_ADMIN_PASSWORD in your local .env.
      # The fallback keeps `docker compose up` zero-config, and the loopback binding below is what
      # keeps that fallback from being reachable off the host.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Anonymous read so the dashboards open with no login in the dev demo. DEV-ONLY.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      # Host 3002: 3000 is the console, 3001 is Langfuse. Loopback only — the admin UI is
      # password-protected but the password is a local default, so it stays off the network.
      - "127.0.0.1:3002:3000"

volumes:
  pgdata:
  clickhouse-data:
  minio-data:
  grafana-data:
